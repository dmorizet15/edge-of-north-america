<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#101317"/>
  <!-- first light: a warm sun cresting the horizon -->
  <defs>
    <radialGradient id="sun" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#F6D9A0"/>
      <stop offset="55%" stop-color="#BE6B2E"/>
      <stop offset="100%" stop-color="#7a4f2b"/>
    </radialGradient>
  </defs>
  <clipPath id="above"><rect x="0" y="0" width="32" height="21"/></clipPath>
  <circle cx="16" cy="21" r="7" fill="url(#sun)" clip-path="url(#above)"/>
  <line x1="5" y1="21" x2="27" y2="21" stroke="#C7D8DF" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
</svg>
